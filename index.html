<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <link rel="stylesheet" href="first.css"></link>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header>
        <div class="navbar">
                <div class="navlogo border">
                    <div class="logo"></div>
                </div>
                <!-- 2 -->
                <div class="navadd border">
                    <p class="deliver">Deliver to</p> 
                    <div class="addicon">
                        <i class="fa-solid fa-location-dot"></i>
                        <p class="India">India</p>
                    </div>
                </div>
                <!-- 3 -->
                <div class="search border">
                    <select class="slct">
                        <option>All</option>
                    </select>
                    <input placeholder="Search Amazon">
                    <div class="search-icon">    
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                </div>
                <!-- box-country -->
                <div class="country border">    
                    <i class="fa-solid fa-earth-americas"></i>
                    <p class="en">EN</p>
                </div>
                
                <!-- 4 -->
                <div class="acc border">
                    <div class="hello">
                        <p class="para"><span class="sign">Hello,sign in</span></p>
                    </div>
                    <div class="list">
                        <p class="acc-list">Account & Lists</p>
                    </div>
                </div>
                <!-- 5 -->
                <div class="orders border">
                    <div class="hello2">
                        <p class="para2"><span class="sign">Returns</span></p>
                    </div>
                    <div class="list2">
                        <p class="acc-list2">& Orders</p>
                    </div>

                </div>
                <!-- box6 -->
                <div class="cart border">
                    <i class="fa-solid fa-cart-shopping"></i>
                </div>
        </div>
        <div class="navbar2">
            <div class="all border">
                <i class="fa-solid fa-bars"></i>
                <p class="p-all">All</p>
            </div>
            <div class="nav2-opt">
                <div class="deal border">
                    <p>Today's Deals</p>
                </div>
                <div class="customer border">
                    <p>Customer service</p>
                </div>
                <div class="registry border">
                    <p>Registry</p>
                </div>
                <div class="gift border">
                    <p>Gift cards</p>
                </div>
                <div class="sell border">
                    <p>Sell</p>
                </div>
            </div>
        </div>
    </header>

    <div class="hero">
        
    </div>
</body>
</html>
